name: Comunidad Telebots · Companion Android DEV
run-name: Companion DEV · arm64-v8a · ${{ github.ref_name }}

# Release candidate: compile the non-debuggable dev package using protected secrets.
# A failed build must not publish an APK or be reported as successful.
on:
  push:
    branches: [feature/ai-pets-and-discovery]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-companion-${{ github.ref }}-dev-arm64-v8a
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'ComunidadTelebots/Telegram'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: android-dev
    env:
      CHANNEL: dev
      BUILD_ABI: arm64-v8a
      GRADLE_USER_HOME: /tmp/telebots-gradle
    steps:
      - name: Descargar exactamente el commit solicitado
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false
          fetch-depth: 1

      - name: Instalar Java 21
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Comprobar que la compilación no activa la depuración
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'buildConfigField "boolean", "DEBUG_VERSION", "false"' TMessagesProj/build.gradle
          grep -Fq 'buildConfigField "boolean", "DEBUG_PRIVATE_VERSION", "false"' TMessagesProj/build.gradle
          grep -Fq 'debuggable false' TMessagesProj_App/build.gradle
          grep -Fq "defaultConfig.applicationId = rootProject.ext.forkApplicationId" TMessagesProj_App/build.gradle
          echo "Perfil release y paquete de Comunidad Telebots confirmados"

      - name: Preparar credenciales Telegram y firma DEV temporal
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          CERT_SHA256: ${{ secrets.CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os, pathlib, re
          api_id = os.environ.get('TELEGRAM_API_ID', '')
          api_hash = os.environ.get('TELEGRAM_API_HASH', '')
          if not re.fullmatch(r'[1-9][0-9]{0,9}', api_id) or int(api_id) > 2147483647:
              raise SystemExit('Falta TELEGRAM_API_ID o no tiene formato válido')
          if not re.fullmatch(r'[a-fA-F0-9]{32}', api_hash):
              raise SystemExit('Falta TELEGRAM_API_HASH o no tiene formato válido')
          source = pathlib.Path('Tools/release/BuildVars.java.template').read_text(encoding='utf-8')
          source, count = re.subn(r'public static int APP_ID = 0;', 'public static int APP_ID = ' + api_id + ';', source)
          assert count == 1, 'Plantilla APP_ID inválida'
          source, count = re.subn(r'public static String APP_HASH = "";', 'public static String APP_HASH = "' + api_hash + '";', source)
          assert count == 1, 'Plantilla APP_HASH inválida'
          destination = pathlib.Path('TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java')
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(source, encoding='utf-8')
          PY
          mkdir -p TMessagesProj/config "$GRADLE_USER_HOME"
          # A legacy keystore is tracked by the Telegram source; never reuse it for DEV.
          rm -f -- TMessagesProj/config/release.keystore
          if [[ -n "$KEYSTORE_BASE64" || -n "$STORE_PASSWORD" || -n "$KEY_ALIAS" || -n "$KEY_PASSWORD" || -n "$CERT_SHA256" ]]; then
            # Never mix permanent and disposable credentials.
            for key in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD CERT_SHA256; do
              if [[ -z "${!key}" ]]; then echo "Incomplete permanent signing configuration: $key"; exit 1; fi
            done
            python3 - <<'PY'
          import base64, os, pathlib
          pathlib.Path('TMessagesProj/config/release.keystore').write_bytes(
              base64.b64decode(''.join(os.environ['KEYSTORE_BASE64'].split()), validate=True)
          )
          PY
            export SIGN_STORE_PASSWORD="$STORE_PASSWORD"
            export SIGN_KEY_ALIAS="$KEY_ALIAS"
            export SIGN_KEY_PASSWORD="$KEY_PASSWORD"
            export EXPECTED_CERT="$(printf '%s' "$CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
            echo "SIGNING_MODE=permanent" >> "$GITHUB_ENV"
          else
            # Disposable private key never leaves this GitHub runner.
            export SIGN_STORE_PASSWORD="$(openssl rand -hex 24)"
            export SIGN_KEY_PASSWORD="$SIGN_STORE_PASSWORD"
            export SIGN_KEY_ALIAS="telebotsdev"
            keytool -genkeypair -noprompt -keystore TMessagesProj/config/release.keystore \
              -alias "$SIGN_KEY_ALIAS" -storepass "$SIGN_STORE_PASSWORD" \
              -keypass "$SIGN_KEY_PASSWORD" -keyalg RSA -keysize 3072 \
              -validity 365 -dname "CN=Comunidad Telebots DEV, OU=Testing, O=Comunidad Telebots, C=ES"
            echo "SIGNING_MODE=temporary" >> "$GITHUB_ENV"
            echo "::warning::Temporary DEV signature: this APK cannot update previous builds signed with another key. Uninstall before replacing; local app data may be lost."
          fi
          # Commit neither the private keystore nor the password.
          export SIGN_STORE_PASSWORD SIGN_KEY_PASSWORD SIGN_KEY_ALIAS
          python3 - <<'PY'
          import os, pathlib
          def escape(value):
              return ''.join('\\u' + chunk for chunk in
                             (value.encode('utf-16-be').hex()[i:i+4] for i in range(0, len(value.encode('utf-16-be').hex()), 4)))
          pathlib.Path(os.environ['GRADLE_USER_HOME'], 'gradle.properties').write_text(
              '\n'.join(key + '=' + escape(os.environ[name]) for key, name in (
                  ('RELEASE_STORE_PASSWORD', 'SIGN_STORE_PASSWORD'),
                  ('RELEASE_KEY_ALIAS', 'SIGN_KEY_ALIAS'),
                  ('RELEASE_KEY_PASSWORD', 'SIGN_KEY_PASSWORD'))), encoding='ascii')
          PY
          keytool -exportcert -alias "$SIGN_KEY_ALIAS" \
            -keystore TMessagesProj/config/release.keystore \
            -storepass "$SIGN_STORE_PASSWORD" -rfc 2>/dev/null |
            openssl x509 -noout -fingerprint -sha256 |
            sed 's/.*=//' | tr -d ':' | tr '[:upper:]' '[:lower:]' > "$RUNNER_TEMP/expected-certificate.sha256"
          if [[ -n "${EXPECTED_CERT:-}" ]]; then
            test "$EXPECTED_CERT" = "$(cat "$RUNNER_TEMP/expected-certificate.sha256")"
          fi

      - name: Instalar SDK Android exacto
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1' 'platform-tools'
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Compilar APK release
        shell: bash
        run: |
          set -euo pipefail
          case "$CHANNEL" in dev) ;; *) exit 1 ;; esac
          abi_args=()
          case "$BUILD_ABI" in
            arm64-v8a) abi_args=(-Pandroid.injected.build.abi=arm64-v8a) ;;
            universal) ;;
            *) exit 1 ;;
          esac
          java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain \
            :TMessagesProj_App:assembleAfatRelease --no-daemon --max-workers=2 --console=plain \
            "-PAPP_CHANNEL=$CHANNEL" -Pkotlin.incremental=false \
            '-Dorg.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g' \
            -Pkotlin.compiler.execution.strategy=in-process "${abi_args[@]}"

      - name: Verificar firma, paquete y preparar descarga
        shell: bash
        run: |
          set -euo pipefail
          apk=$(python3 Tools/release/select_apk.py --build-root TMessagesProj_App/build --channel "$CHANNEL")
          apksigner verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/apk-certificate.txt"
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-certificate.txt" | tr '[:upper:]' '[:lower:]')
          test "$actual" = "$(cat "$RUNNER_TEMP/expected-certificate.sha256")"
          zipalign -c -P 16 4 "$apk"
          aapt dump badging "$apk" > "$RUNNER_TEMP/apk-badging.txt"
          grep -Fq "package: name='org.comunidadtelebots.$CHANNEL'" "$RUNNER_TEMP/apk-badging.txt"
          if grep -q 'application-debuggable' "$RUNNER_TEMP/apk-badging.txt"; then exit 1; fi
          mkdir -p artifacts
          cp "$apk" "artifacts/telebots-$CHANNEL-$BUILD_ABI.apk"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re
          apk = next(pathlib.Path('artifacts').glob('*.apk'))
          line = next(line for line in pathlib.Path(os.environ['RUNNER_TEMP'],'apk-badging.txt').read_text().splitlines() if line.startswith('package: '))
          # Anchor attribute names to whitespace: 'compileSdkVersionCodename'
          # also ends in 'name' and previously overwrote the real package field.
          fields = dict(re.findall(r"(?:^|\s)(name|versionCode|versionName)='([^']*)'", line))
          expected = 'org.comunidadtelebots.' + os.environ['CHANNEL']
          if fields.get('name') != expected:
              raise SystemExit(f"Unexpected APK package: {fields.get('name')!r}, expected {expected!r}")
          assert 0 < int(fields['versionCode']) <= 2100000000
          sha = hashlib.file_digest(apk.open('rb'),'sha256').hexdigest()
          pathlib.Path('artifacts/SHA256SUMS.txt').write_text(sha + '  ' + apk.name + '\n')
          pathlib.Path('artifacts/build.json').write_text(json.dumps(dict(commit=os.environ['GITHUB_SHA'],channel=os.environ['CHANNEL'],abi=os.environ['BUILD_ABI'],sha256=sha,**fields),indent=2))
          PY

      - name: Publicar descarga de APK verificado
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: telebots-companion-dev-arm64-v8a-${{ github.run_number }}
          path: |
            artifacts/*.apk
            artifacts/SHA256SUMS.txt
            artifacts/build.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          include-hidden-files: false

      - name: Eliminar material de firma del runner
        if: always()
        shell: bash
        run: |
          rm -f -- TMessagesProj/config/release.keystore \
            TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java \
            "$GRADLE_USER_HOME/gradle.properties" "$RUNNER_TEMP/expected-certificate.sha256"
