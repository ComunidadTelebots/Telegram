name: QA Telebots outbound UDP socket lifecycle

on:
  pull_request:
    branches: [dev]
    paths:
      - 'TMessagesProj/src/main/java/org/telegram/messenger/TelebotsP2pIndependentMessaging.java'
      - 'TMessagesProj/src/main/java/org/telegram/messenger/TelebotsUdpSender.java'
      - 'Tools/tests/TelebotsUdpSenderTest.java'
      - 'Tools/tests/test_p2p_udp_socket_lifetime.py'
      - '.github/workflows/qa-p2p-udp-sockets.yml'
  push:
    branches: [fix/p2p-udp-socket-lifecycle-20261120]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jvm-and-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout without retained credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Java 21
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Source contract
        run: python3 -m unittest discover -s Tools/tests -p 'test_p2p_udp_socket_lifetime.py' -v
      - name: JVM loopback and failure path
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/udp-tests"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/udp-tests" \
            TMessagesProj/src/main/java/org/telegram/messenger/TelebotsUdpSender.java \
            Tools/tests/TelebotsUdpSenderTest.java
          java -cp "$RUNNER_TEMP/udp-tests" TelebotsUdpSenderTest
