import groovy.json.JsonSlurper

// Firebase must belong to the selected fork application ID, never upstream Telegram.
def mode = rootProject.ext.forkFirebaseMode
def configFile = file('google-services.json')
def matchesPackage = false
if (configFile.exists()) {
    def config = new JsonSlurper().parse(configFile)
    matchesPackage = config.client?.any {
        it.client_info?.android_client_info?.package_name == rootProject.ext.forkApplicationId
    } ?: false
}
if (mode == 'true' && !matchesPackage) {
    throw new GradleException("Firebase required but no matching registration for ${rootProject.ext.forkApplicationId} in ${project.path}/google-services.json")
}
if (mode == 'true' || (mode == 'auto' && matchesPackage)) {
    apply plugin: 'com.google.gms.google-services'
    // Only the actual Android application module owns Crashlytics mappings/symbol upload.
    if (project.plugins.hasPlugin('com.android.application')) {
        apply plugin: 'com.google.firebase.crashlytics'
    }
} else if (mode == 'auto') {
    logger.lifecycle("${project.path}: Firebase disabled; no configuration for ${rootProject.ext.forkApplicationId}")
}
